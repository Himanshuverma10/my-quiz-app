<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenQuiz AI - 3D Experience</title>
    
    <!-- React & ReactDOM (Stable UMD Version) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #e9fff0; margin: 0; overflow-x: hidden; }
        
        /* --- CSS Animations (Replacement for Framer Motion) --- */
        .fade-in { animation: fadeIn 0.8s ease-out forwards; opacity: 0; }
        .slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(40px); }
        .float { animation: float 6s ease-in-out infinite; }
        .pulse-slow { animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.6; } }

        /* 3D Tilt Container */
        .tilt-card {
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }
        
        /* Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #10b981;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 2px 6px rgba(16,185,129,0.4);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e5e7eb;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // --- Icons ---
        const Icons = {
            Brain: () => <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>,
            ArrowRight: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>,
            Trophy: () => <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-yellow-500"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>,
            Loader: () => <svg className="animate-spin" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        };

        // --- Setup View (3D Design) ---
        const SetupView = ({ onGenerate, loading, error }) => {
            const [mode, setMode] = useState('topic');
            const [topic, setTopic] = useState('');
            const [difficulty, setDifficulty] = useState('Medium');
            const [numQuestions, setNumQuestions] = useState(5); // Default 5 questions
            const [fileName, setFileName] = useState('');
            const [sourceText, setSourceText] = useState('');
            
            const fileRef = useRef(null);
            const cardRef = useRef(null);

            // 3D Tilt Effect (Pure JS)
            const handleMouseMove = (e) => {
                if (!cardRef.current) return;
                const rect = cardRef.current.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = ((y - centerY) / 30) * -1; // Invert axis
                const rotateY = (x - centerX) / 30;

                cardRef.current.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            };

            const handleMouseLeave = () => {
                if (cardRef.current) {
                    cardRef.current.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
                }
            };

            const handleFile = async (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                setFileName(file.name);

                if (file.type === 'application/pdf') {
                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        let fullText = "";
                        const maxPages = Math.min(pdf.numPages, 15); 
                        for (let i = 1; i <= maxPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            fullText += textContent.items.map(item => item.str).join(' ') + "\n";
                        }
                        setSourceText(fullText);
                    } catch (err) {
                        alert("Error reading PDF: " + err.message);
                    }
                } else {
                    const text = await file.text();
                    setSourceText(text);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center relative overflow-hidden p-4" onMouseMove={handleMouseMove} onMouseLeave={handleMouseLeave}>
                     {/* Background FX */}
                     <div className="absolute inset-0 -z-10 bg-gradient-to-br from-[#86efac] via-[#bbf7d0] to-white fade-in"></div>
                     <div className="absolute -top-16 left-24 w-72 h-72 rounded-full bg-emerald-300 blur-[120px] opacity-40 float"></div>
                     <div className="absolute bottom-0 right-0 w-80 h-80 rounded-full bg-green-500 blur-[120px] opacity-30 float" style={{animationDelay: '1s'}}></div>

                     <div ref={cardRef} className="max-w-3xl w-full tilt-card slide-up">
                        <div className="bg-white/70 backdrop-blur-xl rounded-3xl shadow-[0_20px_60px_rgba(16,185,129,0.25)] border border-white/40 overflow-hidden">
                            
                            {/* Header */}
                            <div className="p-8 flex items-center justify-between bg-white/50 backdrop-blur-md border-b border-white/40">
                                <div className="flex items-center gap-4">
                                    <div className="w-14 h-14 bg-gradient-to-br from-emerald-500 to-green-600 rounded-2xl shadow-xl flex items-center justify-center float">
                                        <Icons.Brain />
                                    </div>
                                    <div>
                                        <h1 className="text-3xl font-black text-gray-800">GenQuiz AI</h1>
                                        <p className="text-sm text-gray-500 -mt-1">3D • Interactive • Fast</p>
                                    </div>
                                </div>
                                <div className="hidden md:flex items-center gap-2 select-none">
                                    {['Easy', 'Medium', 'Hard'].map(d => (
                                        <button key={d} onClick={() => setDifficulty(d)} className={`px-4 py-2 rounded-full text-sm font-semibold transition border ${difficulty===d ? 'bg-gray-800 text-white border-gray-800' : 'bg-white text-gray-600 border-gray-200'}`}>
                                            {d}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Main Grid */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 p-8">
                                {/* Left Side */}
                                <div className="p-6 bg-white/70 backdrop-blur-xl rounded-2xl shadow-lg border border-emerald-100 flex flex-col justify-between">
                                    <div>
                                        <div className="flex justify-between items-center mb-6">
                                            <h2 className="font-bold text-gray-700">Select Mode</h2>
                                            <div className="flex gap-2 bg-gray-100 p-1 rounded-full">
                                                <button onClick={()=>setMode('topic')} className={`px-4 py-1.5 rounded-full text-sm font-bold transition ${mode==='topic'? 'bg-emerald-600 text-white shadow-md':'text-gray-500'}`}>Topic</button>
                                                <button onClick={()=>setMode('file')} className={`px-4 py-1.5 rounded-full text-sm font-bold transition ${mode==='file'? 'bg-emerald-600 text-white shadow-md':'text-gray-500'}`}>File</button>
                                            </div>
                                        </div>

                                        {mode === 'topic' ? (
                                            <div className="fade-in">
                                                <label className="text-xs text-gray-500 font-bold uppercase tracking-wider mb-2 block">Enter Topic</label>
                                                <input 
                                                    value={topic} 
                                                    onChange={(e)=>setTopic(e.target.value)} 
                                                    placeholder="e.g. Thermodynamics..." 
                                                    className="w-full p-4 rounded-xl border border-gray-200 bg-white focus:ring-2 focus:ring-emerald-400 outline-none font-medium" 
                                                />
                                            </div>
                                        ) : (
                                            <div className="fade-in">
                                                <label className="text-xs text-gray-500 font-bold uppercase tracking-wider mb-2 block">Upload PDF / TXT</label>
                                                <div onClick={()=>fileRef.current.click()} className={`p-6 rounded-xl border-2 border-dashed text-center cursor-pointer transition ${fileName ? 'border-emerald-500 bg-emerald-50 text-emerald-700' : 'border-gray-300 hover:border-emerald-400 hover:bg-gray-50 text-gray-500'}`}>
                                                    <span className="font-bold text-sm">{fileName || 'Tap to Upload'}</span>
                                                </div>
                                                <input type="file" className="hidden" ref={fileRef} accept=".pdf,.txt" onChange={handleFile} />
                                            </div>
                                        )}
                                    </div>
                                    
                                    {/* Question Count Slider */}
                                    <div className="mt-6 fade-in">
                                        <div className="flex justify-between items-center mb-2">
                                            <label className="text-xs text-gray-500 font-bold uppercase tracking-wider">Questions: <span className="text-emerald-600 text-sm">{numQuestions}</span></label>
                                        </div>
                                        <input 
                                            type="range" 
                                            min="3" 
                                            max="15" 
                                            value={numQuestions} 
                                            onChange={(e) => setNumQuestions(parseInt(e.target.value))}
                                            className="w-full accent-emerald-500"
                                        />
                                        <div className="flex justify-between text-[10px] text-gray-400 mt-1">
                                            <span>3</span>
                                            <span>15</span>
                                        </div>
                                    </div>

                                    {error && <div className="mt-4 text-xs text-red-500 bg-red-50 p-2 rounded-lg text-center">{error}</div>}

                                    <button 
                                        className="mt-6 w-full py-4 bg-emerald-600 text-white font-bold rounded-xl shadow-lg hover:bg-emerald-700 flex justify-center items-center gap-2 transition transform active:scale-95 disabled:opacity-70"
                                        onClick={() => onGenerate({ mode, topic, sourceText, difficulty, numQuestions })}
                                        disabled={loading}
                                    >
                                        {loading ? <Icons.Loader /> : "Generate Quiz"}
                                    </button>
                                </div>

                                {/* Right Side (Preview) */}
                                <div className="p-6 rounded-2xl bg-white/60 backdrop-blur-xl border border-emerald-100 shadow-lg hidden md:block">
                                    <h2 className="font-bold text-gray-700 mb-3">Live Preview</h2>
                                    <div className="p-4 rounded-xl border bg-gradient-to-r from-white to-emerald-50">
                                        <p className="font-semibold text-gray-800 text-sm mb-3">Q1: {topic ? `Questions about "${topic}"` : "Your question here..."}</p>
                                        <div className="space-y-2 text-xs">
                                            <div className="p-2 bg-white rounded-lg border text-gray-400">A. Option 1</div>
                                            <div className="p-2 bg-emerald-100 rounded-lg border border-emerald-300 text-emerald-800 font-bold">B. Correct Answer</div>
                                            <div className="p-2 bg-white rounded-lg border text-gray-400">C. Option 3</div>
                                        </div>
                                    </div>
                                    <p className="text-xs text-gray-400 mt-4 text-center">AI will generate {numQuestions} questions instantly.</p>
                                </div>
                            </div>
                        </div>
                     </div>
                </div>
            );
        };

        // --- Quiz View ---
        const QuizView = ({ quizData, currentQ, answers, onAnswer, score, onNext, onQuit }) => {
            const q = quizData[currentQ];
            const answered = answers[currentQ];
            const progress = ((currentQ + 1) / quizData.length) * 100;
            
            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="max-w-2xl w-full bg-white/90 backdrop-blur-xl shadow-2xl rounded-[2rem] overflow-hidden border border-emerald-100 slide-up">
                        <div className="h-2 bg-gray-100 w-full">
                            <div className="h-full bg-emerald-500 transition-all duration-500" style={{ width: `${progress}%` }}></div>
                        </div>
                        <div className="p-8">
                            <div className="flex justify-between items-center mb-6">
                                <span className="text-xs font-bold text-emerald-600 bg-emerald-100 px-3 py-1 rounded-full uppercase tracking-wider">Question {currentQ + 1} of {quizData.length}</span>
                                <button onClick={onQuit} className="text-gray-400 hover:text-red-500 font-bold text-xs uppercase">Quit</button>
                            </div>
                            <h2 className="text-2xl font-bold text-gray-800 mb-8 leading-snug">{q.question}</h2>
                            <div className="space-y-3">
                                {q.options.map((opt, i) => {
                                    const isSelected = answers[currentQ] === opt;
                                    const isCorrect = opt === q.correctAnswer;
                                    let style = "w-full p-5 rounded-xl text-left font-medium border-2 transition-all ";
                                    
                                    if (answered) {
                                        if (isCorrect) style += "border-emerald-500 bg-emerald-50 text-emerald-800";
                                        else if (isSelected) style += "border-red-400 bg-red-50 text-red-800";
                                        else style += "border-gray-100 text-gray-300";
                                    } else {
                                        style += "border-gray-100 hover:border-emerald-400 hover:bg-white text-gray-600 bg-gray-50/50";
                                    }

                                    return <button key={i} disabled={!!answered} onClick={() => onAnswer(opt)} className={style}>{opt}</button>;
                                })}
                            </div>
                            {answered && (
                                <div className="mt-6 p-5 bg-blue-50 text-blue-900 rounded-2xl border border-blue-100 text-sm fade-in">
                                    <strong className="block text-blue-600 text-xs uppercase tracking-wider mb-1">Insight</strong>
                                    {q.explanation}
                                </div>
                            )}
                        </div>
                        <div className="p-6 bg-white border-t border-gray-100 flex justify-end">
                            {answered && (
                                <button onClick={onNext} className="px-8 py-3 bg-emerald-600 text-white rounded-xl font-bold shadow-lg hover:bg-emerald-700 flex items-center gap-2 transition transform active:scale-95">
                                    {currentQ < quizData.length - 1 ? "Next" : "See Results"} <Icons.ArrowRight />
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- Result View ---
        const ResultView = ({ score, total, onRetry }) => (
            <div className="min-h-screen flex items-center justify-center p-4">
                <div className="max-w-md w-full bg-white/90 backdrop-blur-xl shadow-2xl rounded-[2.5rem] p-10 text-center border border-emerald-100 relative overflow-hidden slide-up">
                    <div className="w-24 h-24 bg-yellow-50 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner float">
                        <Icons.Trophy />
                    </div>
                    <h2 className="text-6xl font-black text-emerald-600 mb-2">{Math.round((score/total)*100)}%</h2>
                    <p className="text-gray-400 font-medium mb-8">You scored {score} out of {total}</p>
                    <button onClick={onRetry} className="w-full py-4 bg-gray-900 text-white rounded-2xl font-bold shadow-xl hover:bg-black transition transform hover:scale-[1.02]">
                        Create New Quiz
                    </button>
                </div>
            </div>
        );

        // --- App Component ---
        const App = () => {
            const [view, setView] = useState('setup');
            const [quizData, setQuizData] = useState([]);
            const [currentQ, setCurrentQ] = useState(0);
            const [score, setScore] = useState(0);
            const [answers, setAnswers] = useState({});
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const generateQuiz = async ({ mode, topic, sourceText, difficulty, numQuestions }) => {
                if (mode === 'topic' && !topic) return setError("Please enter a topic");
                if (mode === 'file' && !sourceText) return setError("Please upload a file");
                
                setLoading(true);
                setError('');

                try {
                    const response = await fetch('/api/generate-quiz', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            topic: mode === 'topic' ? topic : "File Content",
                            sourceText: mode === 'file' ? sourceText : null,
                            difficulty,
                            numQuestions
                        })
                    });
                    const data = await response.json();
                    if (data.error) throw new Error(data.error);
                    setQuizData(data);
                    setView('quiz');
                    setCurrentQ(0);
                    setScore(0);
                    setAnswers({});
                } catch (err) {
                    setError("Error: " + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleAnswer = (opt) => {
                const correct = quizData[currentQ].correctAnswer;
                setAnswers({ ...answers, [currentQ]: opt });
                if (opt === correct) setScore(s => s + 1);
            };

            const handleNext = () => {
                if (currentQ < quizData.length - 1) setCurrentQ(c => c + 1);
                else setView('result');
            };

            return (
                <React.Fragment>
                    {view === 'setup' && <SetupView onGenerate={generateQuiz} loading={loading} error={error} />}
                    {view === 'quiz' && (
                        <QuizView 
                            quizData={quizData} 
                            currentQ={currentQ} 
                            answers={answers} 
                            onAnswer={handleAnswer} 
                            score={score} 
                            onNext={handleNext}
                            onQuit={() => setView('setup')}
                        />
                    )}
                    {view === 'result' && <ResultView score={score} total={quizData.length} onRetry={() => setView('setup')} />}
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
