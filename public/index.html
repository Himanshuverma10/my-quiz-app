<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GenQuiz AI - Redesigned</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-green-50 via-white to-green-100">
  <div id="root"></div>

  <script type="text/babel">
    const App = () => {
      return (
        <div className="min-h-screen flex flex-col items-center justify-center p-6">
          {/* Logo Section */}
          <div className="text-center mb-8 animate-fadeIn">
            <div className="w-20 h-20 rounded-2xl bg-green-600 flex items-center justify-center shadow-xl mb-4 animate-bounceSlow">
              <span className="text-white text-4xl font-bold">GQ</span>
            </div>
            <h1 className="text-4xl font-extrabold text-green-700 tracking-wide drop-shadow-md">GenQuiz AI</h1>
            <p className="text-gray-600 mt-2">Smart • Fast • Interactive</p>
          </div>

          {/* Card */}
          <div className="bg-white shadow-2xl rounded-3xl p-10 w-full max-w-xl backdrop-blur-xl border border-green-100 animate-slideUp">
            <h2 className="text-xl font-semibold text-gray-700 mb-4">Start Creating Your Quiz</h2>

            <div className="grid grid-cols-2 gap-4 mb-6">
              <button className="py-3 rounded-xl bg-green-600 text-white font-semibold shadow hover:bg-green-700 transition transform hover:scale-105">Topic Mode</button>
              <button className="py-3 rounded-xl bg-gray-200 text-gray-700 font-semibold shadow hover:bg-gray-300 transition transform hover:scale-105">Document Mode</button>
            </div>

            <input type="text" placeholder="Enter a topic..." className="w-full p-4 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-400 outline-none mb-6" />

            <button className="w-full py-4 bg-green-600 text-white rounded-xl font-bold text-lg shadow-lg hover:bg-green-700 transition transform hover:scale-105 active:scale-95">
              Generate Quiz
            </button>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
